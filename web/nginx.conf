# SPA fallback under the /job-search-web-ui/ basePath (matches
# .env.production's VITE_BASE_PATH) — react-router's client-side routes
# (/postings, /map) need every direct/refreshed request to fall back to
# index.html, not nginx's default per-path 404.
server {
    listen 80;

    location /job-search-web-ui/ {
        alias /usr/share/nginx/html/job-search-web-ui/;
        try_files $uri $uri/ /job-search-web-ui/index.html;
    }
}

sync-marimohub:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  image: alpine:latest
  before_script:
    - apk add --no-cache curl tar gzip git
  script:
    # Archive the full checkout including .git so marimohub can:
    #   a) run uv sync --inexact from pyproject.toml (installs pipelines.common)
    #   b) capture multi-file edits when publishing back from a session
    # Shallow clone (GIT_DEPTH: 1 below) keeps the .git dir within the
    # 100 MB decompressed limit.  .venv, __pycache__, node_modules are
    # excluded by .gitignore and not present in a fresh CI checkout.
    - tar czf /tmp/sync.tgz --transform='s|^\./||' .
    - |
      curl --fail-with-body -X POST "$MARIMOHUB_SYNC_URL" \
        -H "Authorization: Bearer $MARIMOHUB_SYNC_TOKEN" \
        -H "Content-Type: application/gzip" \
        -H "X-Marimohub-Archive-Format: tar.gz" \
        -H "X-Marimohub-Repo: $CI_PROJECT_PATH" \
        -H "X-Marimohub-Branch: main" \
        -H "X-Marimohub-Root-Path: " \
        -H "X-Marimohub-Commit: $CI_COMMIT_SHA" \
        --data-binary @/tmp/sync.tgz
  variables:
    GIT_DEPTH: "1"

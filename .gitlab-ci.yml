sync-marimohub:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  image: alpine:latest
  before_script:
    - apk add --no-cache curl tar gzip git
  script:
    # git archive produces a clean tar without ./ prefixes or .git dir.
    # pyproject.toml is included so marimohub runs uv sync --inexact at
    # session start, which installs pipelines.common. Multi-file session
    # publishing is not available without .git; add a separate step later
    # if write-back beyond the entry notebook is needed.
    - git archive --format=tar.gz -o /tmp/sync.tgz HEAD
    - |
      curl --fail-with-body -X POST "$MARIMOHUB_SYNC_URL" \
        -H "Authorization: Bearer $MARIMOHUB_SYNC_TOKEN" \
        -H "Content-Type: application/gzip" \
        -H "X-Marimohub-Archive-Format: tar.gz" \
        -H "X-Marimohub-Repo: $CI_PROJECT_PATH" \
        -H "X-Marimohub-Branch: main" \
        -H "X-Marimohub-Root-Path: " \
        -H "X-Marimohub-Commit: $CI_COMMIT_SHA" \
        --data-binary @/tmp/sync.tgz
  variables:
    GIT_DEPTH: "1"
